[project]
name = "ai-study-assistant"
version = "0.1.0"
description = "以 Ollama 串流生成回答的 AI 學習助教"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.7",
    "python-dotenv>=1.0.1",
]

[project.scripts]
study-assistant = "ai_study_assistant.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_study_assistant"]
